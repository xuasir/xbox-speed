name: Package and Release

on:
  push:
    branches:
      - release/test
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: xbox-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Test and build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n files/usr/bin/xbox-accel
          sh -n files/etc/init.d/xbox-accel
          sh -n files/usr/libexec/rpcd/xbox-accel
          sh -n install.sh
          bash -n tools/publish_release.sh
          python3 tests/test_ci_release.py
          python3 tests/test_build_ipk.py
          python3 tests/test_publish_release.py
          python3 tests/test_cgi.py
          node tests/test_luci.js

      - name: Resolve beta or stable version
        id: meta
        run: python3 tools/ci_release.py

      - name: Build IPK and source bundle
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          OUTPUT_DIR: ${{ runner.temp }}/xbox-package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_ipk.py --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA" --output-dir "$OUTPUT_DIR"
          cd "$OUTPUT_DIR"
          sha256sum -c SHA256SUMS.txt

      - name: Record build summary
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          printf '## Xbox Accel build\n\n- Channel: `%s`\n- Version: `%s`\n- Release tag: `%s`\n- Commit: `%s`\n' \
            "$CHANNEL" "$PACKAGE_VERSION" "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: xbox-package-${{ steps.meta.outputs.version }}
          path: ${{ runner.temp }}/xbox-package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  publish:
    name: Publish beta or stable GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: xbox-release-publication-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out release tooling from the same commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified packages
        uses: actions/download-artifact@v5
        with:
          name: xbox-package-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/xbox-release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_NAME: ${{ needs.build.outputs.name }}
          ASSET_DIR: ${{ runner.temp }}/xbox-release-assets
        shell: bash
        run: bash tools/publish_release.sh "$ASSET_DIR"
